<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="32" height="32" rx="7.5" fill="url(#brandGrad)" />

  <!-- Speed / Route Waypoint Line -->
  <path d="M 3.5 26.5 L 28.5 26.5" stroke="#93c5fd" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.85" />

  <!-- Commercial Semi-Truck Silhouette -->
  <g filter="url(#shadow)">
    <!-- Trailer / Cargo Box -->
    <rect x="4" y="10" width="10.5" height="11.5" rx="1.5" fill="#ffffff" />
    <!-- Chassis Connector -->
    <rect x="14" y="18" width="1.5" height="2" fill="#e2e8f0" />
    <!-- Aerodynamic Cab -->
    <path d="M 15.5 13.5 L 20.5 13.5 L 23.5 17.5 L 23.5 21.5 L 15.5 21.5 Z" fill="#ffffff" />
    <!-- Windshield -->
    <path d="M 16.8 15 L 20 15 L 22.2 18 L 16.8 18 Z" fill="#1e40af" />
    <!-- Amber Marker Light -->
    <rect x="23" y="19.5" width="1" height="1.5" rx="0.5" fill="#fef08a" />
    <!-- Rear Tire -->
    <circle cx="8" cy="22.5" r="2.2" fill="#0f172a" />
    <circle cx="8" cy="22.5" r="0.9" fill="#94a3b8" />
    <!-- Front Tire -->
    <circle cx="20" cy="22.5" r="2.2" fill="#0f172a" />
    <circle cx="20" cy="22.5" r="0.9" fill="#94a3b8" />
  </g>

  <!-- Safety Shield Overlay -->
  <g filter="url(#shadow)">
    <path d="M 23.5 3.5 L 28.5 5.5 L 28.5 9.5 C 28.5 13 26 15.5 23.5 16.5 C 21 15.5 18.5 13 18.5 9.5 L 18.5 5.5 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
    <!-- White Checkmark -->
    <path d="M 21.2 9.5 L 22.8 11.2 L 26.2 7.8" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
